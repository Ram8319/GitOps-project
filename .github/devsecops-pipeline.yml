name: Secure Nginx CI/CD

on:
  push:
    branches: [ "Dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. LINTING: Check Dockerfile for best practices
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # 2. SAST: Static Application Security Testing
      - name: Run Semgrep (SAST)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep \
          --config=p/security-audit --error

      # 3. BUILD: Create the image locally for scanning
      - name: Build local image
        run: docker build -t nginx-secure:${{ github.sha }} .

      # 4. VULNERABILITY SCAN: Check for OS/Package vulnerabilities
      - name: Scan Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nginx-secure:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fails the build if vulnerabilities are found
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 5. REGISTRY PUSH: Only happens if all previous steps pass
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Registry
        if: github.event_name != 'pull_request'
        run: |
          docker tag nginx-secure:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/nginx-prod:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nginx-prod:latest